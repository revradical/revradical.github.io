<h1>NAS Calendar Sync</h1>
<p>NAS Calendar Sync is a personal, single-user tool that copies events from a self-hosted calendar server to the owner's own Google Calendar so they can be read aloud by a smart speaker.</p>
<p>It is not offered to the public and has no other users.</p>
